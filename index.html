```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Ty Amore mio 🖤💖</title>

<style>

body{
  margin:0;
  background:linear-gradient(#f8c8d8,#fdecef);

  display:flex;
  justify-content:center;
  align-items:center;

  min-height:100vh;

  font-family:'Courier New', monospace;
}

/* CARD */

.card{
  position:relative;

  width:360px;
  min-height:640px;

  background:#fdecef;

  border-radius:25px;

  box-shadow:0 0 30px rgba(255,150,180,.5);

  overflow:hidden;

  padding:20px;

  text-align:center;
}

/* TITULO */

h1{
  font-size:26px;
  margin-top:10px;
}

/* SUBTEXTO */

.sub{
  margin-top:20px;
  font-size:16px;
}

/* CONTADOR */

.counter{
  margin-top:10px;

  color:#c03a6b;

  font-size:20px;

  font-variant-numeric:tabular-nums;

  font-weight:bold;

  letter-spacing:1px;
}

/* ESCENA */

.scene{
  position:relative;

  margin:25px auto;

  width:260px;
}

.scene img{
  width:100%;
  border-radius:10px;
}

/* FAROLES */

.glow{
  position:absolute;

  width:15px;
  height:15px;

  border-radius:50%;

  background:rgba(255,190,120,.8);

  box-shadow:0 0 10px rgba(255,190,120,.9);

  animation:glow 4s ease-in-out infinite;
}

@keyframes glow{

  0%,100%{
    opacity:.4;
  }

  50%{
    opacity:1;
  }
}

/* FLORES */

.flower{
  position:absolute;

  width:8px;
  height:8px;

  border-radius:50%;

  background:#f6a7c1;

  opacity:.7;

  animation:float 8s linear infinite;
}

@keyframes float{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-60px);
  }
}

/* CHISPITAS */

.spark{
  position:absolute;

  width:6px;
  height:6px;

  border-radius:50%;

  animation:spark 2s linear forwards;
}

@keyframes spark{

  from{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  to{
    opacity:0;
    transform:translateY(-60px) scale(0);
  }
}

/* BOTÓN */

#boton-flotante{

  margin-top:25px;

  width:90px;
  height:90px;

  border:none;
  border-radius:50%;

  background:linear-gradient(135deg,#ff7aa8,#ffb6c1);

  color:white;

  font-size:34px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-left:auto;
  margin-right:auto;

  box-shadow:0 0 20px rgba(255,120,160,.6);

  transition:all .3s ease;
}

#boton-flotante:hover{

  transform:scale(1.08);

  box-shadow:0 0 35px rgba(255,120,160,.9);
}

</style>
</head>

<body>

<div class="card">

  <h1>Para Ty Amore mio 🖤💖</h1>

  <div class="scene">

    <img src="arbol_cerezo.png" alt="Arbol de cerezo">

    <!-- FAROLES -->

    <div class="glow" style="top:40%;left:20%;"></div>

    <div class="glow" style="top:38%;right:20%;"></div>

    <!-- FLORES -->

    <div class="flower" style="left:30%;top:80%;"></div>

    <div class="flower" style="left:60%;top:85%;"></div>

  </div>

  <div class="sub">
    Mi amor por ti comenzó hace…
  </div>

  <div class="counter" id="contador"></div>

  <!-- BOTÓN -->

  <button id="boton-flotante"><i> ¡200! </i></button>

</div>

<script>

/* FECHA */

const inicio = new Date("2025-11-10T01:30:00-05:00");

/* CONTADOR */

function actualizar(){

  const ahora = new Date();

  let diff = ahora - inicio;

  const s = Math.floor(diff/1000)%60;

  const m = Math.floor(diff/60000)%60;

  const h = Math.floor(diff/3600000)%24;

  const d = Math.floor(diff/86400000);

  document.getElementById("contador").innerHTML =
  `${d} días ${h} horas ${m} minutos ${s} segundos`;
}

setInterval(actualizar,1000);

actualizar();

/* FUEGOS ARTIFICIALES */

const boton = document.getElementById("boton-flotante");

boton.addEventListener("click", () => {

  for(let i=0;i<80;i++){

    const spark = document.createElement("div");

    spark.classList.add("spark");

    spark.style.left =
      Math.random()*window.innerWidth + "px";

    spark.style.top =
      Math.random()*window.innerHeight + "px";

    spark.style.background =
      `hsl(${Math.random()*360},100%,70%)`;

    document.body.appendChild(spark);

    setTimeout(()=>{
      spark.remove();
    },2000);
  }
});

</script>

</body>
</html>
```
