<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti, Amore mio 🖤💖</title>

<style>

body{
  margin:0;
  background:linear-gradient(#f8c8d8,#fdecef);

  display:flex;
  justify-content:center;
  align-items:center;

  min-height:100vh;

  font-family:'Courier New', monospace;

  overflow:hidden;
}

/* CARD */

.card{
  position:relative;

  width:360px;
  min-height:640px;

  background:#fdecef;

  border-radius:25px;

  box-shadow:0 0 30px rgba(255,150,180,.5);

  overflow:hidden;

  padding:20px;

  text-align:center;

  z-index:2;
}

/* TITULO */

h1{
  font-size:26px;
  margin-top:10px;
}

/* SUB */

.sub{
  margin-top:20px;
  font-size:16px;
}

/* CONTADOR */

.counter{
  margin-top:10px;

  color:#c03a6b;

  font-size:20px;

  font-weight:bold;

  font-variant-numeric:tabular-nums;

  letter-spacing:1px;
}

/* ESCENA */

.scene{
  position:relative;

  margin:25px auto;

  width:260px;
}

.scene img{
  width:100%;
  border-radius:10px;
}

/* FAROLES */

.glow{
  position:absolute;

  width:15px;
  height:15px;

  border-radius:50%;

  background:rgba(255,190,120,.8);

  box-shadow:0 0 10px rgba(255,190,120,.9);

  animation:glow 4s ease-in-out infinite;
}

@keyframes glow{

  0%,100%{
    opacity:.4;
  }

  50%{
    opacity:1;
  }
}

/* FLORES */

.flower{
  position:absolute;

  width:8px;
  height:8px;

  border-radius:50%;

  background:#f6a7c1;

  opacity:.7;

  animation:float 8s linear infinite;
}

@keyframes float{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-60px);
  }
}

/* BOTÓN */

#boton-flotante{

  margin-top:25px;

  width:90px;
  height:90px;

  border:none;
  border-radius:50%;

  background:linear-gradient(135deg,#ff7aa8,#ffb6c1);

  color:white;

  font-size:34px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-left:auto;
  margin-right:auto;

  box-shadow:0 0 20px rgba(255,120,160,.6);

  transition:.3s;

  z-index:5;
}

#boton-flotante:hover{

  transform:scale(1.08);

  box-shadow:0 0 35px rgba(255,120,160,.9);
}

/* PANEL CARTA */

#panel-carta{

  position:fixed;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%) scale(.8);

  width:300px;

  background:white;

  border-radius:20px;

  padding:25px;

  text-align:center;

  box-shadow:0 0 40px rgba(0,0,0,.2);

  opacity:0;

  pointer-events:none;

  transition:.4s;

  z-index:999;
}

#panel-carta.active{

  opacity:1;

  transform:translate(-50%,-50%) scale(1);

  pointer-events:auto;
}

#panel-carta h2{

  color:#c03a6b;
}

#panel-carta p{

  color:#444;

  line-height:1.5;
}

/* BOTÓN CERRAR */

#cerrar{

  margin-top:15px;

  border:none;

  background:#ff7aa8;

  color:white;

  padding:10px 18px;

  border-radius:10px;

  cursor:pointer;
}

/* FUEGOS */

.spark{

  position:fixed;

  width:6px;
  height:6px;

  border-radius:50%;

  pointer-events:none;

  animation:spark 2s linear forwards;
}

@keyframes spark{

  from{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  to{
    opacity:0;
    transform:translateY(-80px) scale(0);
  }
}

</style>
</head>

<body>

<div class="card">

  <h1>Para ti, Amore mio 🖤💖</h1>

  <div class="scene">

    <img src="arbol_cerezo.png" alt="Arbol de cerezo">

    <div class="glow" style="top:40%;left:20%;"></div>

    <div class="glow" style="top:38%;right:20%;"></div>

    <div class="flower" style="left:30%;top:80%;"></div>

    <div class="flower" style="left:60%;top:85%;"></div>

  </div>

  <div class="sub">
    Mi amor por ti comenzó hace…
  </div>

  <div class="counter" id="contador"></div>

  <button id="boton-flotante">💌</button>

</div>

<!-- PANEL -->

<div id="panel-carta">

  <h2>Para ti 💖</h2>

  <p>
    Gracias por existir, por quedarte,
    por cada risa, cada instante y cada
    día que haces especial. ✨
  </p>

  <button id="cerrar">Cerrar</button>

</div>

<script>

/* FECHA */

const inicio = new Date("2025-11-10T01:30:00-05:00");

/* CONTADOR */

function actualizar(){

  const ahora = new Date();

  let diff = ahora - inicio;

  const s = Math.floor(diff/1000)%60;

  const m = Math.floor(diff/60000)%60;

  const h = Math.floor(diff/3600000)%24;

  const d = Math.floor(diff/86400000);

  document.getElementById("contador").innerHTML =
  `${d} días ${h} horas ${m} minutos ${s} segundos`;
}

setInterval(actualizar,1000);

actualizar();

/* PANEL */

const boton =
document.getElementById("boton-flotante");

const panel =
document.getElementById("panel-carta");

const cerrar =
document.getElementById("cerrar");

boton.addEventListener("click", ()=>{

  panel.classList.add("active");

  iniciarFuegos();
});

cerrar.addEventListener("click", ()=>{

  panel.classList.remove("active");
});

/* FUEGOS EN BUCLE */

let fireworksStarted = false;

function iniciarFuegos(){

  if(fireworksStarted) return;

  fireworksStarted = true;

  setInterval(()=>{

    for(let i=0;i<25;i++){

      const spark =
      document.createElement("div");

      spark.classList.add("spark");

      spark.style.left =
      Math.random()*window.innerWidth + "px";

      spark.style.top =
      Math.random()*window.innerHeight + "px";

      spark.style.background =
      `hsl(${Math.random()*360},100%,70%)`;

      document.body.appendChild(spark);

      setTimeout(()=>{
        spark.remove();
      },2000);
    }

  },700);
}

</script>

</body>
</html>
```
